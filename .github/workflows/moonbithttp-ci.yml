name: moonbit-ci

on:
  push:
    branches: [main, codex/http-quality-round-four]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonbithttp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tls-platform:
    name: Native regression (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26
        with:
          version: 0.10.22+124d61d05

      - name: Update package registry
        run: moon update

      - name: Install OpenSSL build dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential perl curl ca-certificates

      - name: Build pinned OpenSSL 3.6 on Ubuntu
        if: runner.os == 'Linux'
        run: moon run repo-tools/scripts/install_ci_openssl.mbtx -- 3.6

      - name: Verify pinned OpenSSL on Ubuntu
        if: runner.os == 'Linux'
        run: openssl version -a

      - name: Install OpenSSL on macOS
        if: runner.os == 'macOS'
        run: brew list --versions openssl@3 >/dev/null || brew install openssl@3

      - name: Install OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "3.5.9"
          $root = Join-Path $env:RUNNER_TEMP "openssl-$version"
          $installer = Join-Path $env:RUNNER_TEMP "Win64OpenSSL_Light-3_5_9.exe"
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL_Light-3_5_9.exe" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne "9f4773a32d8a5da770f57ff5ef2dfa7f6c28e9eef2f5bc2e25ac54e6ee1581dc") {
            throw "OpenSSL installer SHA-256 mismatch: $actual"
          }
          Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$root"
          ) -Wait -NoNewWindow
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Homebrew OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Verify Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          openssl_root="$(brew --prefix openssl@3)"
          test -x "$openssl_root/bin/openssl"
          "$openssl_root/bin/openssl" version -a
          version=$("$openssl_root/bin/openssl" version | awk '{print $2}')
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -ne 3 ] || [ "$minor" -lt 5 ]; then
            echo "OpenSSL 3.x (3.5 or later) is required; found $version"
            exit 1
          fi

      - name: Verify OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = Join-Path $env:OPENSSL_ROOT_DIR "bin\openssl.exe"
          if (!(Test-Path -LiteralPath $openssl)) { throw "OpenSSL executable not found at $openssl" }
          & $openssl version -a
          $version = (& $openssl version).Split()[1]
          $parts = $version.Split('.')
          if ([int]$parts[0] -ne 3 -or [int]$parts[1] -lt 5) {
            throw "OpenSSL 3.x (3.5 or later) is required; found $version"
          }

      - name: Run public API tests on Native
        run: moon run tests/run.mbtx -- blackbox native

      - name: Run private unit tests on Native
        run: moon run tests/run.mbtx -- whitebox native

      - name: Run integration tests on Native
        timeout-minutes: 10
        run: moon run tests/run.mbtx -- integration native

      - name: Run Native TLS leak and handle lifecycle tests on Linux
        if: runner.os == 'Linux'
        run: moon run repo-tools/scripts/validate_native_tls_asan.mbtx

      - name: Run Native TLS tests with AddressSanitizer
        if: runner.os == 'macOS'
        run: moon run repo-tools/scripts/validate_native_tls_asan.mbtx

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - &checkout-history
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - &setup-moon
        name: Setup MoonBit
        uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26
        with:
          version: 0.10.22+124d61d05

      - &registry-update
        name: Update package registry
        run: moon update

      - &linux-packages
        name: Install native TLS and interoperability runtimes
        run: sudo apt-get update && sudo apt-get install -y build-essential perl curl wget nghttp2-client unzip ca-certificates python3-venv golang-go

      - &openssl-cache
        name: Cache pinned OpenSSL 3.5 LTS runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/ci-openssl/3.5.*/install
          key: openssl-3.5-lts-linux-${{ runner.arch }}-shared-${{ hashFiles('repo-tools/scripts/install_ci_openssl.mbtx') }}

      - &openssl-build
        name: Build and select OpenSSL with QUIC TLS callbacks
        run: moon run repo-tools/scripts/install_ci_openssl.mbtx

      - name: Check formatting
        run: moon fmt --check

      - name: Check package boundaries and dependency snapshot
        run: moon run repo-tools/tools/check_architecture.mbtx

      - name: Check code (deny warnings)
        run: moon check --target all --deny-warn --warn-list +73

      - name: Verify root package layout
        run: |
          test ! -d src
          test -f moon.mod
          ! rg -n 'source\s*=\s*"src"|moon (run|test) src/' . --glob '!_build/**' --glob '!target/**'

      - name: Build all targets
        run: moon build --target all --deny-warn --warn-list +73

      - name: Regenerate and verify public interfaces
        run: |
          moon info --target all
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'

      - name: Verify every test belongs to exactly one suite
        run: |
          for target in native wasm wasm-gc js; do moon run tests/run.mbtx -- verify "$target"; done

      - name: Run public API tests on portable backends
        run: |
          for target in wasm wasm-gc js; do moon run tests/run.mbtx -- blackbox "$target"; done

      - name: Run private unit tests on portable backends
        run: |
          for target in wasm wasm-gc js; do moon run tests/run.mbtx -- whitebox "$target"; done

      - name: Run integration tests on portable backends
        run: |
          for target in wasm wasm-gc js; do moon run tests/run.mbtx -- integration "$target"; done

      - name: Verify executed async tests on Native, Wasm and JS and synchronous QUIC on Wasm-GC
        run: moon run repo-tools/tools/check_runtime_tests.mbtx

      - name: Run socket interoperability checks
        run: moon run repo-tools/tools/interoperability.mbtx

      - name: Generate fresh instrumented coverage report
        run: |
          moon coverage clean
          moon coverage analyze -- -f cobertura -o coverage.xml

      - name: Check final worktree hygiene
        run: git diff --check

  interoperability:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - *checkout-history
      - *setup-moon
      - *registry-update
      - *linux-packages
      - *openssl-cache
      - *openssl-build
      - name: Prepare independent HTTP/3 peers
        run: moon run repo-tools/tools/prepare_http3_interop.mbtx

      - name: Run independent HTTP/3 and QUIC TLS loss/reorder interoperability
        run: moon run repo-tools/tools/http3_interoperability.mbtx --reverse --impair --duration-seconds 60 --concurrent-requests 8

      - name: Verify HTTP/3 pool recovery after a quic-go server restart
        run: |
          go -C repo-tools/tools/quic_go_reset_reference build -mod=readonly -o "$PWD/_build/quic-go-reset-reference" .
          moon run repo-tools/tools/http3_interoperability.mbtx --peer-restart "$PWD/_build/quic-go-reset-reference"

      - name: Exercise the original key-update deadline twenty times
        if: matrix.run == 1
        run: moon run repo-tools/tools/http3_interoperability.mbtx -- --key-update-runs 20 --impairment combined

      - name: Compare aioquic with the previous read key retained
        if: always() && matrix.run == 1
        run: |
          moon run repo-tools/tools/prepare_http3_interop.mbtx -- --old-read-key-control
          PYTHONPATH="$PWD/_build/interop-aioquic/old-read-key-control" moon run repo-tools/tools/http3_interoperability.mbtx -- --key-update-runs 20 --impairment combined

      - name: Isolate the direct, loss and reorder profiles
        if: matrix.run == 2
        run: |
          for profile in direct drop reorder; do
            moon run repo-tools/tools/http3_interoperability.mbtx -- --key-update-runs 2 --impairment "$profile"
          done

      - name: Summarize local peer observations
        if: always()
        run: |
          find _build/evidence/http3-interoperability -name '*.public.json' -exec jq -c '{case,verified,client,elapsed_us,alpn_negotiated,key_update_requested,response_received}' {} \; >> "$GITHUB_STEP_SUMMARY"

      - name: Retain loopback events
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loopback-events-${{ matrix.run }}-${{ github.run_attempt }}
          path: _build/evidence/http3-interoperability/**/*.public.json
          retention-days: 14
          if-no-files-found: warn

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - *checkout-history
      - *setup-moon
      - *registry-update
      - *linux-packages
      - *openssl-cache
      - *openssl-build
      - name: Execute native release benchmarks
        run: moon run repo-tools/tools/benchmarks.mbtx

      - name: Gate HTTP/1 decoder performance against the reviewed baseline
        env:
          MOONBITHTTP_PERF_BASE: b098720de9294a05f102ab51643e0f0931d0e99e
        run: moon run repo-tools/tools/performance_comparison.mbtx

      - name: Compare Go and MoonBit H1/H2 with the same probe
        run: moon run repo-tools/tools/go_net_http_reference.mbtx -- --compare

      - name: Export window measurements
        run: |
          mkdir -p _build/public-evidence
          jq '{revision,go_version,moon_server_sha256,go_binary_sha256,payload_bytes,concurrency,windows:[.windows[] | {server,window,protocol,result:(.result | {elapsed_seconds,requests,latency_samples,errors,throughput_per_second,p50_ms,p95_ms,p99_ms})}]}' _build/evidence/performance/go-net-http-reference/*/result.json > _build/public-evidence/windows.json
          jq -c '.windows[]' _build/public-evidence/windows.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain performance windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-windows-${{ github.run_attempt }}
          path: _build/public-evidence/windows.json
          retention-days: 14

  sustained-h3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - *checkout-history
      - *setup-moon
      - *registry-update
      - *linux-packages
      - *openssl-cache
      - *openssl-build
      - name: Prepare pinned independent HTTP/3 peer
        run: moon run repo-tools/tools/prepare_http3_interop.mbtx
      - name: Measure sustained connection reuse and delayed paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build/soak-public
          for profile in sustained delayed; do
            seconds=1800
            flags=(--mixed)
            if [[ "$profile" == delayed ]]; then
              seconds=60
              flags+=(--impair)
              sudo tc qdisc add dev lo root netem delay 20ms rate 200mbit limit 2000
            fi
            log="_build/$profile-aioquic.log"
            _build/interop-aioquic/venv/bin/python _build/interop-aioquic/upstream/examples/http3_server.py --host 127.0.0.1 --port 18452 --certificate tests/fixtures/tls/localhost.cert.pem --private-key tests/fixtures/tls/localhost.key.pem >"$log" 2>&1 &
            peer=$!
            trap 'kill "$peer" 2>/dev/null || true; if [[ "$profile" == delayed ]]; then sudo tc qdisc del dev lo root || true; fi' EXIT
            moon run repo-tools/tools/http3_interoperability.mbtx -- --peer-soak 127.0.0.1:18452 localhost:18452 tests/fixtures/tls/localhost.cert.pem "$seconds" 4 "${flags[@]}" | tee "_build/$profile-run.log"
            dir=$(sed -n 's/^HTTP\/3 peer soak evidence: //p' "_build/$profile-run.log")
            moon run repo-tools/tools/verify_http3_peer_soak.mbtx -- "$dir/result.json" "$log" >"_build/soak-public/$profile-peer.json"
            jq '.measurement' "$dir/result.json" >"_build/soak-public/$profile-client.json"
            cp "$dir/client.resources.json" "_build/soak-public/$profile-resources.json"
            cat "_build/soak-public/$profile-client.json" >> "$GITHUB_STEP_SUMMARY"
            kill "$peer"
            wait "$peer" || true
            if [[ "$profile" == delayed ]]; then sudo tc qdisc del dev lo root; fi
            trap - EXIT
          done
      - name: Retain sustained connection measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sustained-h3-${{ github.run_attempt }}
          path: _build/soak-public/*.json
          retention-days: 14

  frozen-package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - *checkout-history
      - *setup-moon
      - *registry-update
      - *linux-packages
      - *openssl-cache
      - *openssl-build
      - name: Resolve pinned dependencies before freezing the package
        run: moon check --target native --deny-warn --warn-list +73
      - name: Verify frozen package and release evidence
        run: moon run repo-tools/tools/release_evidence.mbtx


  acceptance:
    if: always()
    needs: [build-and-test, native-tls-platform, interoperability, performance, sustained-h3, frozen-package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
