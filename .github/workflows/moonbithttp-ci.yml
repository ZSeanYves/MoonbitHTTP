name: moonbit-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonbithttp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tls-platform:
    name: native TLS (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.14+7d59c7ec9

      - name: Update package registry
        run: moon update

      - name: Install OpenSSL build dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential perl curl ca-certificates

      - name: Build pinned OpenSSL 3.5 on Ubuntu
        if: runner.os == 'Linux'
        run: moon run repo-tools/scripts/install_ci_openssl.mbtx

      - name: Verify pinned OpenSSL on Ubuntu
        if: runner.os == 'Linux'
        run: openssl version -a

      - name: Install OpenSSL on macOS
        if: runner.os == 'macOS'
        run: brew list --versions openssl@3 >/dev/null || brew install openssl@3

      - name: Install OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "3.5.9"
          $root = Join-Path $env:RUNNER_TEMP "openssl-$version"
          $installer = Join-Path $env:RUNNER_TEMP "Win64OpenSSL_Light-3_5_9.exe"
          Invoke-WebRequest -Uri "https://slproweb.com/download/Win64OpenSSL_Light-3_5_9.exe" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne "9f4773a32d8a5da770f57ff5ef2dfa7f6c28e9eef2f5bc2e25ac54e6ee1581dc") {
            throw "OpenSSL installer SHA-256 mismatch: $actual"
          }
          Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$root"
          ) -Wait -NoNewWindow
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Homebrew OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Verify Homebrew OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          openssl_root="$(brew --prefix openssl@3)"
          test -x "$openssl_root/bin/openssl"
          "$openssl_root/bin/openssl" version -a
          version=$("$openssl_root/bin/openssl" version | awk '{print $2}')
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 5 ]; }; then
            echo "OpenSSL 3.5 or newer is required; found $version"
            exit 1
          fi

      - name: Verify OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = Join-Path $env:OPENSSL_ROOT_DIR "bin\openssl.exe"
          if (!(Test-Path -LiteralPath $openssl)) { throw "OpenSSL executable not found at $openssl" }
          & $openssl version -a
          $version = (& $openssl version).Split()[1]
          $parts = $version.Split('.')
          if ([int]$parts[0] -lt 3 -or ([int]$parts[0] -eq 3 -and [int]$parts[1] -lt 5)) {
            throw "OpenSSL 3.5 or newer is required; found $version"
          }

      - name: Run Native TLS certificate and identity suite
        run: moon test protocol/quic adapter/native/tls --target native --no-parallelize --deny-warn --warn-list +73

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.14+7d59c7ec9

      - name: Update package registry
        run: moon update

      - name: Install native TLS and interoperability runtimes
        run: sudo apt-get update && sudo apt-get install -y build-essential perl curl wget nghttp2-client unzip ca-certificates python3-venv

      - name: Cache pinned OpenSSL 3.5 LTS runtime
        uses: actions/cache@v4
        with:
          path: _build/ci-openssl/install
          key: openssl-3.5.8-linux-${{ runner.arch }}-shared-${{ hashFiles('repo-tools/scripts/install_ci_openssl.mbtx') }}

      - name: Build and select OpenSSL with QUIC TLS callbacks
        run: moon run repo-tools/scripts/install_ci_openssl.mbtx

      - name: Check formatting
        run: moon fmt --check

      - name: Check architecture boundaries and generated dependency graph
        run: moon run repo-tools/tools/check_architecture.mbtx

      - name: Check code (deny warnings)
        run: moon check --target all --deny-warn --warn-list +73

      - name: Verify root package layout
        run: |
          test ! -d src
          test -f moon.mod
          ! rg -n 'source\s*=\s*"src"|moon (run|test) src/' . --glob '!_build/**' --glob '!target/**'

      - name: Build all targets
        run: moon build --target all --deny-warn --warn-list +73

      - name: Regenerate and verify public interfaces
        run: |
          moon info --target all
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'

      - name: Run tests
        run: moon test --target all --no-parallelize --deny-warn --warn-list +73

      - name: Run async integration tests
        run: moon test runtime/service core/body internal/test_support adapter/uv --target native --no-parallelize --deny-warn --warn-list +73

      - name: Run socket interoperability checks
        run: moon run repo-tools/tools/interoperability.mbtx

      - name: Prepare independent HTTP/3 client
        run: moon run repo-tools/tools/prepare_http3_interop.mbtx

      - name: Run independent HTTP/3 and QUIC TLS loss/reorder interoperability
        run: moon run repo-tools/tools/http3_interoperability.mbtx --impair --duration-seconds 60 --concurrent-requests 8

      - name: Execute native release benchmarks
        run: moon run repo-tools/tools/benchmarks.mbtx

      - name: Verify frozen package and release evidence
        run: moon run repo-tools/tools/release_evidence.mbtx

      - name: Generate fresh instrumented coverage report
        run: |
          moon coverage clean
          moon coverage analyze -- -f cobertura -o coverage.xml

      - name: Check final worktree hygiene
        run: git diff --check

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            _build/evidence/
            _build/publish/
            coverage.xml
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ZSeanYves/MoonbitHTTP
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
